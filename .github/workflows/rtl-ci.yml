name: rtl-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install simulators (runner packages, not the pinned versions)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator
          iverilog -V | head -1
          verilator --version
      - name: Install cocotb
        run: |
          python -m venv .venv
          .venv/bin/pip install -r verification/requirements.txt
      - name: Lint
        run: make -C verification lint
      - name: Simulation
        run: make -C verification sim
      - name: Negative control
        run: make -C verification negctl
